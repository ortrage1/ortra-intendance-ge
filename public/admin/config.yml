# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
# Outil d’édition du site, relié au dépôt GitHub du projet.
backend:
  name: github
  repo: ortrage1/ortra-intendance-ge
  branch: main

locale: fr
media_folder: /public/documents
public_folder: /documents

collections:
  - name: reponses
    label: Questions fréquentes
    label_singular: Question
    description: Les réponses directes affichées en tête de la recherche.
    folder: /src/content/reponses
    extension: md
    format: frontmatter
    create: true
    slug: "{{titre}}"
    summary: "{{titre}}"
    sortable_fields: [ordre, titre]
    fields:
      - { name: titre, label: Question, widget: string }
      - { name: resume, label: "Réponse en bref (2 phrases)", widget: text }
      - { name: motsCles, label: "Mots que les gens tapent", widget: list, hint: "Synonymes, anciens noms, abréviations. Un mot ou une expression par ligne." }
      - name: formation
        label: Formation concernée
        widget: select
        options: [{ label: CFC, value: cfc }, { label: AFP, value: afp }, { label: Les deux, value: les-deux }]
      - name: public
        label: Pour qui ?
        widget: select
        multiple: true
        required: false
        options:
          - { label: "Je découvre (jeunes, parents)", value: decouvrir }
          - { label: Je me reconvertis, value: reconversion }
          - { label: Je forme, value: former }
          - { label: J'évalue, value: evaluer }
      - name: rubrique
        label: Rubrique du site
        hint: "La page de rubrique où cette question apparaît dans la liste."
        widget: select
        required: false
        options:
          - { label: Les métiers, value: metiers }
          - { label: Se former, value: se-former }
          - { label: En apprentissage, value: apprentis }
          - { label: "Former : devenir entreprise formatrice", value: former }
          - { label: "Former : vous formez déjà", value: formateurs }
          - { label: Évaluer, value: evaluer }
      - name: aussiDans
        label: Afficher aussi dans
        hint: "Facultatif : d'autres rubriques où cette question doit aussi apparaître."
        widget: select
        multiple: true
        required: false
        options:
          - { label: Les métiers, value: metiers }
          - { label: Se former, value: se-former }
          - { label: En apprentissage, value: apprentis }
          - { label: "Former : devenir entreprise formatrice", value: former }
          - { label: "Former : vous formez déjà", value: formateurs }
          - { label: Évaluer, value: evaluer }
      - name: parcours
        label: Parcours guidé de la page d'accueil
        hint: "Facultatif : les thèmes du parcours « Trouvez votre réponse en trois clics » où cette question doit apparaître."
        widget: select
        multiple: true
        required: false
        options:
          - { label: "Je découvre › Le métier et les diplômes", value: "decouvrir/metier" }
          - { label: "Je découvre › Essayer et trouver une place", value: "decouvrir/essayer" }
          - { label: "Je découvre › L'apprentissage, concrètement", value: "decouvrir/concret" }
          - { label: "Adulte › Obtenir le diplôme", value: "adulte/diplome" }
          - { label: "Adulte › Me préparer et commencer", value: "adulte/commencer" }
          - { label: "Apprenti › Mon contrat et mes droits", value: "apprenti/droits" }
          - { label: "Apprenti › Mes horaires et mes frais", value: "apprenti/horaires" }
          - { label: "Apprenti › Les cours et l'examen", value: "apprenti/cours" }
          - { label: "Apprenti › J'ai besoin d'aide", value: "apprenti/aide" }
          - { label: "Entreprise qui veut former › Devenir entreprise formatrice", value: "entreprise/commencer" }
          - { label: "Entreprise qui veut former › Préparer la formation", value: "entreprise/preparer" }
          - { label: "Formateur › Le suivi au quotidien", value: "formateur/suivi" }
          - { label: "Formateur › Contrat, horaires et frais", value: "formateur/contrat" }
          - { label: "Formateur › Un apprenti en difficulté", value: "formateur/difficulte" }
          - { label: "Formateur › L'examen final", value: "formateur/examen" }
          - { label: "Expert·e ou commissaire › Devenir expert·e ou commissaire", value: "evaluer/devenir" }
          - { label: "Expert·e ou commissaire › Ma mission", value: "evaluer/mission" }
      - { name: ordre, label: "Ordre d'affichage", widget: number, value_type: int, default: 99 }
      - name: source
        label: Source officielle
        widget: object
        fields:
          - { name: libelle, label: Nom de la source, widget: string }
          - { name: url, label: Adresse web, widget: string, required: false }
      - { name: verifieLe, label: Vérifié le, widget: datetime, time_format: false, date_format: "DD.MM.YYYY", format: "YYYY-MM-DD" }
      - name: statut
        label: Statut
        widget: select
        options: [{ label: Vérifié, value: verifie }, { label: À confirmer, value: a-confirmer }]
      - { name: body, label: Réponse complète, widget: markdown }

  - name: metiers
    label: Fiches métier
    label_singular: Fiche métier
    folder: /src/content/metiers
    extension: md
    format: frontmatter
    create: false
    summary: "{{titre}}"
    fields:
      - { name: titre, label: Titre officiel, widget: string }
      - { name: sigle, label: Diplôme, widget: select, options: [CFC, AFP] }
      - name: formation
        label: Formation
        widget: select
        options: [{ label: CFC, value: cfc }, { label: AFP, value: afp }]
      - { name: duree, label: Durée, widget: string }
      - { name: resume, label: Résumé, widget: text }
      - { name: anciensNoms, label: "Anciens noms et abréviations", widget: list, required: false }
      - name: source
        label: Source officielle
        widget: object
        fields:
          - { name: libelle, label: Nom de la source, widget: string }
          - { name: url, label: Adresse web, widget: string, required: false }
      - { name: verifieLe, label: Vérifié le, widget: datetime, time_format: false, date_format: "DD.MM.YYYY", format: "YYYY-MM-DD" }
      - { name: body, label: Texte de la fiche, widget: markdown }

  - name: reperes
    label: Repères pratiques (formateurs)
    description: "Semaines par département, mandats et cours interentreprises, d'après les factsheets. À mettre à jour quand une nouvelle factsheet sort."
    files:
      - name: cfc
        label: Repères CFC
        file: /src/content/reperes/cfc.json
        format: json
        fields:
          - { name: sigle, label: Diplôme, widget: select, options: [CFC, AFP] }
          - { name: titre, label: Titre du diplôme, widget: string }
          - { name: duree, label: "Durée (ex. 3 ans, 6 semestres)", widget: string }
          - { name: revision, label: "Révision de la factsheet (ex. mai 2025)", widget: string }
          - { name: factsheet, label: "Adresse de la factsheet officielle (PDF)", widget: string }
          - { name: examen, label: Examen final en une phrase, widget: text }
          - name: domaines
            label: Domaines de compétences
            label_singular: Domaine
            widget: list
            summary: "{{code}} · {{ou}}"
            fields:
              - { name: code, label: Lettre, widget: select, options: [A, B, C, D, E] }
              - { name: nom, label: Nom officiel, widget: string }
              - { name: ou, label: "Où dans l'établissement", widget: string }
              - { name: exemples, label: Exemples concrets, widget: string }
          - name: semestres
            label: Semestres
            label_singular: Semestre
            widget: list
            summary: "Semestre {{numero}}"
            fields:
              - { name: numero, label: Numéro du semestre, widget: number, value_type: int }
              - { name: accueil, label: "Semaines à l'accueil (A)", widget: number, value_type: int, default: 0 }
              - { name: service, label: "Semaines au service (B)", widget: number, value_type: int, default: 0 }
              - { name: nettoyage, label: "Semaines au nettoyage (C)", widget: number, value_type: int, default: 0 }
              - { name: linge, label: "Semaines au linge (D)", widget: number, value_type: int, default: 0 }
              - name: mandats
                label: Mandats pratiques
                label_singular: Mandat
                widget: list
                summary: "{{code}} {{texte}}"
                fields:
                  - { name: code, label: "Code (ex. MPE 101)", widget: string }
                  - { name: texte, label: En langage simple, widget: string }
                  - { name: domaines, label: Domaines concernés, widget: select, multiple: true, options: [A, B, C, D, E] }
              - { name: aussi, label: "À faire aussi (rapport, entretien…)", widget: list, required: false }
          - name: cie
            label: Cours interentreprises
            label_singular: Module
            widget: list
            summary: "{{nom}} ({{jours}} jours)"
            fields:
              - { name: nom, label: "Nom (ex. CIE 1)", widget: string }
              - { name: jours, label: Nombre de jours, widget: number, value_type: float }
              - { name: contenu, label: Contenu, widget: list }
      - name: afp
        label: Repères AFP
        file: /src/content/reperes/afp.json
        format: json
        fields:
          - { name: sigle, label: Diplôme, widget: select, options: [CFC, AFP] }
          - { name: titre, label: Titre du diplôme, widget: string }
          - { name: duree, label: "Durée (ex. 3 ans, 6 semestres)", widget: string }
          - { name: revision, label: "Révision de la factsheet (ex. mai 2025)", widget: string }
          - { name: factsheet, label: "Adresse de la factsheet officielle (PDF)", widget: string }
          - { name: examen, label: Examen final en une phrase, widget: text }
          - name: domaines
            label: Domaines de compétences
            label_singular: Domaine
            widget: list
            summary: "{{code}} · {{ou}}"
            fields:
              - { name: code, label: Lettre, widget: select, options: [A, B, C, D, E] }
              - { name: nom, label: Nom officiel, widget: string }
              - { name: ou, label: "Où dans l'établissement", widget: string }
              - { name: exemples, label: Exemples concrets, widget: string }
          - name: semestres
            label: Semestres
            label_singular: Semestre
            widget: list
            summary: "Semestre {{numero}}"
            fields:
              - { name: numero, label: Numéro du semestre, widget: number, value_type: int }
              - { name: accueil, label: "Semaines à l'accueil (A)", widget: number, value_type: int, default: 0 }
              - { name: service, label: "Semaines au service (B)", widget: number, value_type: int, default: 0 }
              - { name: nettoyage, label: "Semaines au nettoyage (C)", widget: number, value_type: int, default: 0 }
              - { name: linge, label: "Semaines au linge (D)", widget: number, value_type: int, default: 0 }
              - name: mandats
                label: Mandats pratiques
                label_singular: Mandat
                widget: list
                summary: "{{code}} {{texte}}"
                fields:
                  - { name: code, label: "Code (ex. MPE 101)", widget: string }
                  - { name: texte, label: En langage simple, widget: string }
                  - { name: domaines, label: Domaines concernés, widget: select, multiple: true, options: [A, B, C, D, E] }
              - { name: aussi, label: "À faire aussi (rapport, entretien…)", widget: list, required: false }
          - name: cie
            label: Cours interentreprises
            label_singular: Module
            widget: list
            summary: "{{nom}} ({{jours}} jours)"
            fields:
              - { name: nom, label: "Nom (ex. CIE 1)", widget: string }
              - { name: jours, label: Nombre de jours, widget: number, value_type: float }
              - { name: contenu, label: Contenu, widget: list }
  - name: bibliotheque
    label: Documents
    files:
      - name: documents
        label: Bibliothèque de documents
        file: /src/content/documents.json
        format: json
        fields:
          - name: documents
            label: Documents
            label_singular: Document
            widget: list
            root: true
            summary: "{{titre}}"
            fields:
              - { name: id, label: "Identifiant (sans espaces ni accents)", widget: string }
              - { name: titre, label: Titre, widget: string }
              - { name: url, label: "Adresse du document (ou fichier téléversé)", widget: file }
              - { name: editeur, label: Éditeur, widget: string }
              - name: formation
                label: Formation
                widget: select
                options: [{ label: CFC, value: cfc }, { label: AFP, value: afp }, { label: Les deux, value: les-deux }]
              - name: type
                label: Type de document
                widget: select
                options:
                  - { label: Ordonnance, value: ordonnance }
                  - { label: Plan de formation, value: plan-de-formation }
                  - { label: Programme de formation, value: programme }
                  - { label: Examen final, value: examen }
                  - { label: Information, value: information }
                  - { label: Calendrier, value: calendrier }
                  - { label: Formulaire, value: formulaire }
              - name: lieu
                label: Lieu d'apprentissage
                widget: select
                options:
                  - { label: Entreprise, value: entreprise }
                  - { label: École professionnelle, value: ecole }
                  - { label: Cours interentreprises, value: cours-interentreprises }
                  - { label: Examen, value: examen }
                  - { label: Général, value: general }
              - { name: date, label: Date du document, widget: string, required: false }
              - { name: verifieLe, label: Vérifié le, widget: datetime, time_format: false, date_format: "DD.MM.YYYY", format: "YYYY-MM-DD" }
              - name: mode
                label: Mode de diffusion
                widget: select
                default: lien
                options: [{ label: Lien vers l'éditeur, value: lien }, { label: Copie autorisée, value: copie }, { label: Hébergé par OrTra, value: heberge }]
              - { name: populaire, label: "Afficher sur la page d'accueil", widget: boolean, default: false }
              - { name: motsCles, label: "Mots-clés pour la recherche", widget: list, required: false, hint: "Autres mots que les gens pourraient taper, séparés par des virgules." }
