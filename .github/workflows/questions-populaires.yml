name: Questions les plus consultées

on:
  schedule:
    - cron: '0 5 * * 1' # chaque lundi à 5 h (UTC)
  workflow_dispatch: {}  # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

jobs:
  mise-a-jour:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Lire les statistiques et mettre à jour la liste
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: node scripts/questions-populaires.mjs
      - name: Enregistrer si la liste a changé
        run: |
          if git diff --quiet; then echo "Aucun changement."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/populaires.json
          git commit -m "chore: mise à jour des questions les plus consultées"
          git push
